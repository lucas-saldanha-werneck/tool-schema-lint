[project]
name = "tool-schema-lint"
version = "0.1.0"
description = "Lint LLM tool definitions for traits that make agents pick the wrong tool or pass bad arguments."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tool-schema-lint = "tool_schema_lint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_schema_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
